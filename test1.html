<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f2ef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        .signup-container h2 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .signup-container p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .input-field {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .agree-btn {
            width: 100%;
            background-color: #0a66c2;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        .agree-btn:hover {
            background-color: #004182;
        }
        .policy-text {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        .policy-text a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: bold;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #ddd;
        }
        .divider span {
            padding: 0 10px;
            font-size: 14px;
            color: #666;
        }
        .signin-link {
            font-size: 14px;
            color: #666;
        }
        .signin-link a {
            color: #0a66c2;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Sign up</h2>
        <p>Make the most of your professional life.</p>
        <input type="email" class="input-field" placeholder="Email">
        <input type="password" class="input-field" placeholder="Password">
        <button class="agree-btn">Agree & Join</button>
        <p class="policy-text">
            By clicking Agree & Join or Continue, you agree to LinkedIn's 
            <a href="#">User Agreement</a>, 
            <a href="#">Privacy Policy</a>, and 
            <a href="#">Cookie Policy</a>.
        </p>
        <div class="divider"><span>Or</span></div>
        <p class="signin-link">Already on LinkedIn? <a href="#">Sign in</a></p>
    </div>
</body>
</html>
